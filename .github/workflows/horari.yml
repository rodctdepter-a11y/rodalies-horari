name: Horari oficial del dia

on:
  schedule:
    - cron: '30 2 * * *'     # cada dia a les 2:30 UTC (3:30 o 4:30 a Catalunya)
  workflow_dispatch:          # permet executar-lo a mà des de la pestanya Actions

permissions:
  contents: write

jobs:
  horari:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepara l'horari d'avui i de demà
        run: python scripts/horari.py
      - name: Desa els fitxers al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A horari
          git diff --cached --quiet || git commit -m "Horari $(date -u +%F)"
          git push
